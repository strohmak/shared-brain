<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">

  <!-- Background -->
  <rect width="680" height="620" fill="#0f0f0f"/>

  <!-- Title -->
  <text x="340" y="36" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Shared Brain — Project Lifecycle</text>
  <text x="340" y="56" text-anchor="middle" fill="#555" font-size="12">Every project compounds on the last — nothing starts from zero</text>

  <!-- PHASE 1 -->
  <rect x="240" y="74" width="200" height="70" rx="10" fill="#0d2d2d" stroke="#00b4b4" stroke-width="1.5"/>
  <text x="340" y="100" text-anchor="middle" fill="#00b4b4" font-size="14" font-weight="bold">1. Initiation</text>
  <text x="340" y="118" text-anchor="middle" fill="#888" font-size="11">Notion task · first chat session</text>
  <text x="340" y="134" text-anchor="middle" fill="#666" font-size="11">chat tagged to Notion project ID</text>

  <line x1="340" y1="146" x2="340" y2="178" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- PHASE 2 -->
  <rect x="240" y="180" width="200" height="70" rx="10" fill="#1a0d2d" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="340" y="206" text-anchor="middle" fill="#9b59b6" font-size="14" font-weight="bold">2. Active Work</text>
  <text x="340" y="224" text-anchor="middle" fill="#888" font-size="11">chat → output → Notion updated</text>
  <text x="340" y="240" text-anchor="middle" fill="#666" font-size="11">insights flagged · contradictions resolved</text>

  <line x1="340" y1="252" x2="340" y2="284" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- PHASE 3 -->
  <rect x="240" y="286" width="200" height="70" rx="10" fill="#1a0800" stroke="#e67e22" stroke-width="1.5"/>
  <text x="340" y="312" text-anchor="middle" fill="#e67e22" font-size="14" font-weight="bold">3. Completion</text>
  <text x="340" y="330" text-anchor="middle" fill="#888" font-size="11">docs · video · audio · transcript</text>
  <text x="340" y="346" text-anchor="middle" fill="#666" font-size="11">all session chats included</text>

  <line x1="340" y1="358" x2="340" y2="390" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- PHASE 4 -->
  <rect x="200" y="392" width="280" height="80" rx="10" fill="#1a1500" stroke="#f0a500" stroke-width="1.5"/>
  <text x="340" y="418" text-anchor="middle" fill="#f0a500" font-size="14" font-weight="bold">4. Graduation to Vault</text>
  <text x="340" y="436" text-anchor="middle" fill="#888" font-size="11">one question: worth remembering permanently?</text>
  <text x="340" y="454" text-anchor="middle" fill="#666" font-size="11">full package → Supabase · tagged · versioned</text>

  <!-- Loop arrow back -->
  <path d="M200 432 L140 432 L140 109 L238 109" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="30" y="280" text-anchor="middle" fill="#444" font-size="11" transform="rotate(-90 30 280)">informs next project</text>

  <!-- RIGHT SIDE OUTPUTS -->
  <line x1="440" y1="221" x2="490" y2="221" stroke="#333" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <line x1="440" y1="321" x2="490" y2="321" stroke="#333" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <line x1="480" y1="432" x2="490" y2="432" stroke="#333" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <rect x="492" y="196" width="150" height="50" rx="8" fill="#0a1f1f" stroke="#00b4b4" stroke-width="0.5"/>
  <text x="567" y="216" text-anchor="middle" fill="#00b4b4" font-size="12" font-weight="bold">Methodology</text>
  <text x="567" y="234" text-anchor="middle" fill="#666" font-size="11">refines each project</text>

  <rect x="492" y="296" width="150" height="50" rx="8" fill="#0a1f1f" stroke="#00b4b4" stroke-width="0.5"/>
  <text x="567" y="316" text-anchor="middle" fill="#00b4b4" font-size="12" font-weight="bold">Case studies</text>
  <text x="567" y="334" text-anchor="middle" fill="#666" font-size="11">content + portfolio</text>

  <rect x="492" y="407" width="150" height="50" rx="8" fill="#0a1f1f" stroke="#00b4b4" stroke-width="0.5"/>
  <text x="567" y="427" text-anchor="middle" fill="#00b4b4" font-size="12" font-weight="bold">Training base</text>
  <text x="567" y="445" text-anchor="middle" fill="#666" font-size="11">hire-ready from day one</text>

  <!-- THREE HORIZONS -->
  <rect x="30" y="500" width="620" height="100" rx="10" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="340" y="524" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Three Horizons — same system, expanding scope</text>

  <rect x="46" y="536" width="178" height="52" rx="8" fill="#0d2d2d" stroke="#00b4b4" stroke-width="0.5"/>
  <text x="135" y="556" text-anchor="middle" fill="#00b4b4" font-size="12" font-weight="bold">Horizon 1 — Solo</text>
  <text x="135" y="574" text-anchor="middle" fill="#666" font-size="11">personal memory · content engine</text>

  <rect x="251" y="536" width="178" height="52" rx="8" fill="#1a0d2d" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="340" y="556" text-anchor="middle" fill="#9b59b6" font-size="12" font-weight="bold">Horizon 2 — Team</text>
  <text x="340" y="574" text-anchor="middle" fill="#666" font-size="11">onboarding · shared methodology</text>

  <rect x="456" y="536" width="178" height="52" rx="8" fill="#1a1500" stroke="#f0a500" stroke-width="0.5"/>
  <text x="545" y="556" text-anchor="middle" fill="#f0a500" font-size="12" font-weight="bold">Horizon 3 — Firm</text>
  <text x="545" y="574" text-anchor="middle" fill="#666" font-size="11">institutional memory · productized</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

</svg>