  <rect x="235" y="74" width="190" height="100" rx="10" fill="#0d2d2d" stroke="#00b4b4" stroke-width="1"/>
  <text x="330" y="98" text-anchor="middle" fill="#00b4b4" font-size="13" font-weight="bold">Claude Mobile</text>
  <text x="330" y="116" text-anchor="middle" fill="#888" font-size="11">On-the-go capture</text>
  <text x="330" y="134" text-anchor="middle" fill="#666" font-size="11">voice via Wispr Flow</text>
  <text x="330" y="150" text-anchor="middle" fill="#666" font-size="11">quick thoughts · anywhere</text>

  <rect x="440" y="74" width="210" height="100" rx="10" fill="#0d2d2d" stroke="#00b4b4" stroke-width="1"/>
