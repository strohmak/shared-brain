  <text x="545" y="150" text-anchor="middle" fill="#666" font-size="11">route files · automate</text>

  <!-- Arrows down -->
  <line x1="125" y1="176" x2="125" y2="210" stroke="#333" stroke-width="1" marker-end="url(#b)"/>
  <line x1="330" y1="176" x2="270" y2="210" stroke="#333" stroke-width="1" marker-end="url(#b)"/>
  <line x1="545" y1="176" x2="570" y2="210" stroke="#333" stroke-width="1" marker-end="url(#b)"/>

