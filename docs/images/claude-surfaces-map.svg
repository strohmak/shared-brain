  <text x="340" y="530" text-anchor="middle" fill="#666" font-size="11">tasks · projects · clients</text>

  <rect x="460" y="486" width="190" height="60" rx="10" fill="#0a1f1f" stroke="#00b4b4" stroke-width="1"/>
  <text x="555" y="512" text-anchor="middle" fill="#00b4b4" font-size="13" font-weight="bold">Obsidian wiki</text>
