  <!-- ROW 1: CAPTURE SURFACES -->
  <rect x="30" y="74" width="190" height="100" rx="10" fill="#0d2d2d" stroke="#00b4b4" stroke-width="1"/>
  <text x="125" y="98" text-anchor="middle" fill="#00b4b4" font-size="13" font-weight="bold">Claude for Chrome</text>
  <text x="125" y="116" text-anchor="middle" fill="#888" font-size="11">Capture surface</text>
  <text x="125" y="134" text-anchor="middle" fill="#666" font-size="11">clip · save links</text>
