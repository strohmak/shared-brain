  <text x="497" y="236" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="bold">Claude Code</text>
  <text x="497" y="254" text-anchor="middle" fill="#888" font-size="11">Automation surface</text>
  <text x="497" y="272" text-anchor="middle" fill="#666" font-size="11">scripts · auto-ingest transcripts</text>
  <text x="497" y="290" text-anchor="middle" fill="#666" font-size="11">generate Obsidian pages from vault</text>
  <text x="497" y="308" text-anchor="middle" fill="#555" font-size="10">GTM engineering skill development</text>

  <!-- Arrows down -->
