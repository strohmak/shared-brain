<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">

  <!-- Background -->
  <rect width="680" height="520" fill="#0f0f0f"/>

  <!-- Title -->
  <text x="340" y="36" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">The Shared Brain — Three Layer Architecture</text>

  <!-- LAYER 1: SUPABASE -->
  <rect x="30" y="60" width="620" height="120" rx="12" fill="#0d2d2d" stroke="#00b4b4" stroke-width="1.5"/>
  <text x="340" y="88" text-anchor="middle" fill="#00b4b4" font-size="14" font-weight="bold">Layer 1 — Open Brain (Supabase)</text>
  <text x="340" y="108" text-anchor="middle" fill="#888" font-size="12">The vault · raw knowledge · source of truth · never edited directly</text>
  <rect x="50" y="118" width="160" height="44" rx="8" fill="#0a1f1f" stroke="#00b4b4" stroke-width="1"/>
  <text x="130" y="136" text-anchor="middle" fill="#00b4b4" font-size="12" font-weight="bold">documents</text>
  <text x="130" y="153" text-anchor="middle" fill="#666" font-size="11">source material</text>
  <rect x="260" y="118" width="160" height="44" rx="8" fill="#0a1f1f" stroke="#00b4b4" stroke-width="1"/>
  <text x="340" y="136" text-anchor="middle" fill="#00b4b4" font-size="12" font-weight="bold">memories</text>
  <text x="340" y="153" text-anchor="middle" fill="#666" font-size="11">insights · realizations</text>
  <rect x="470" y="118" width="160" height="44" rx="8" fill="#0a1f1f" stroke="#00b4b4" stroke-width="1"/>
  <text x="550" y="136" text-anchor="middle" fill="#00b4b4" font-size="12" font-weight="bold">sessions</text>
  <text x="550" y="153" text-anchor="middle" fill="#666" font-size="11">meeting minutes</text>

  <!-- Arrow down -->
  <line x1="340" y1="182" x2="340" y2="218" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="205" fill="#555" font-size="11">Claude as nervous system</text>

  <!-- LAYER 2: CONVERSATION -->
  <rect x="30" y="220" width="620" height="120" rx="12" fill="#1a0d2d" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="340" y="248" text-anchor="middle" fill="#9b59b6" font-size="14" font-weight="bold">Layer 2 — Conversation Layer (Claude)</text>
  <text x="340" y="268" text-anchor="middle" fill="#888" font-size="12">Every session is a collaborative synthesis event</text>
  <rect x="50" y="278" width="175" height="44" rx="8" fill="#120920" stroke="#9b59b6" stroke-width="1"/>
  <text x="137" y="296" text-anchor="middle" fill="#9b59b6" font-size="12" font-weight="bold">Load context</text>
  <text x="137" y="313" text-anchor="middle" fill="#666" font-size="11">AI retrieves relevant vault</text>
  <rect x="252" y="278" width="175" height="44" rx="8" fill="#120920" stroke="#9b59b6" stroke-width="1"/>
  <text x="339" y="296" text-anchor="middle" fill="#9b59b6" font-size="12" font-weight="bold">Think together</text>
  <text x="339" y="313" text-anchor="middle" fill="#666" font-size="11">brainstorm · analyze · build</text>
  <rect x="454" y="278" width="175" height="44" rx="8" fill="#120920" stroke="#9b59b6" stroke-width="1"/>
  <text x="541" y="296" text-anchor="middle" fill="#9b59b6" font-size="12" font-weight="bold">Review + commit</text>
  <text x="541" y="313" text-anchor="middle" fill="#666" font-size="11">agree · save to vault</text>

  <!-- Arrow down -->
  <line x1="340" y1="342" x2="340" y2="378" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="365" fill="#555" font-size="11">compiled into</text>

  <!-- LAYER 3: OBSIDIAN -->
  <rect x="30" y="380" width="620" height="120" rx="12" fill="#1a1500" stroke="#f0a500" stroke-width="1.5"/>
  <text x="340" y="408" text-anchor="middle" fill="#f0a500" font-size="14" font-weight="bold">Layer 3 — Wiki (Obsidian)</text>
  <text x="340" y="428" text-anchor="middle" fill="#888" font-size="12">Compiled understanding · reflects how you think · never edited directly</text>
  <rect x="50" y="438" width="160" height="44" rx="8" fill="#100f00" stroke="#f0a500" stroke-width="1"/>
  <text x="130" y="456" text-anchor="middle" fill="#f0a500" font-size="12" font-weight="bold">Client pages</text>
  <text x="130" y="473" text-anchor="middle" fill="#666" font-size="11">evolving context</text>
  <rect x="260" y="438" width="160" height="44" rx="8" fill="#100f00" stroke="#f0a500" stroke-width="1"/>
  <text x="340" y="456" text-anchor="middle" fill="#f0a500" font-size="12" font-weight="bold">Topic pages</text>
  <text x="340" y="473" text-anchor="middle" fill="#666" font-size="11">GTM · AI · ADHD</text>
  <rect x="470" y="438" width="160" height="44" rx="8" fill="#100f00" stroke="#f0a500" stroke-width="1"/>
  <text x="550" y="456" text-anchor="middle" fill="#f0a500" font-size="12" font-weight="bold">Thinking log</text>
  <text x="550" y="473" text-anchor="middle" fill="#666" font-size="11">how views evolve</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

</svg>