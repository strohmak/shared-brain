  <text x="340" y="398" text-anchor="middle" fill="#888" font-size="12">SQL + vector search · single source of truth · AI-agnostic</text>

  <!-- Arrow down -->
  <line x1="340" y1="422" x2="340" y2="458" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- OUTPUTS -->
  <rect x="30" y="460" width="190" height="60" rx="10" fill="#120920" stroke="#9b59b6" stroke-width="1"/>
  <text x="125" y="486" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="bold">Obsidian Wiki</text>
  <text x="125" y="504" text-anchor="middle" fill="#666" font-size="11">compiled understanding</text>

  <rect x="245" y="460" width="190" height="60" rx="10" fill="#120920" stroke="#9b59b6" stroke-width="1"/>
  <text x="340" y="486" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="bold">Content Engine</text>
  <text x="340" y="504" text-anchor="middle" fill="#666" font-size="11">LinkedIn · YouTube</text>

  <rect x="460" y="460" width="190" height="60" rx="10" fill="#120920" stroke="#9b59b6" stroke-width="1"/>
  <text x="555" y="486" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="bold">Client Context</text>
  <text x="555" y="504" text-anchor="middle" fill="#666" font-size="11">memory · methodology</text>

  <!-- Governing rule -->
  <rect x="30" y="535" width="620" height="34" rx="8" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="557" text-anchor="middle" fill="#555" font-size="11">Governing rule: nothing enters the vault without a moment of intention</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

</svg>