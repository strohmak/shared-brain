  <!-- INPUT: Chat -->
  <rect x="340" y="74" width="140" height="110" rx="10" fill="#0d2d2d" stroke="#00b4b4" stroke-width="1"/>
  <text x="410" y="98" text-anchor="middle" fill="#00b4b4" font-size="13" font-weight="bold">Chat</text>
  <rect x="356" y="108" width="108" height="30" rx="6" fill="#0a1f1f" stroke="#00b4b4" stroke-width="0.5"/>
  <text x="410" y="128" text-anchor="middle" fill="#888" font-size="11">Claude desktop</text>
  <rect x="356" y="144" width="108" height="30" rx="6" fill="#0a1f1f" stroke="#00b4b4" stroke-width="0.5"/>
  <text x="410" y="164" text-anchor="middle" fill="#888" font-size="11">Claude mobile</text>

  <!-- INPUT: Files -->
  <rect x="495" y="74" width="155" height="110" rx="10" fill="#0d2d2d" stroke="#00b4b4" stroke-width="1"/>
  <text x="572" y="98" text-anchor="middle" fill="#00b4b4" font-size="13" font-weight="bold">Files</text>
  <rect x="511" y="108" width="123" height="30" rx="6" fill="#0a1f1f" stroke="#00b4b4" stroke-width="0.5"/>
  <text x="572" y="128" text-anchor="middle" fill="#888" font-size="11">Google Drive · Notion</text>
  <rect x="511" y="144" width="123" height="30" rx="6" fill="#0a1f1f" stroke="#00b4b4" stroke-width="0.5"/>
  <text x="572" y="164" text-anchor="middle" fill="#888" font-size="11">GitHub repos · PDFs</text>

  <!-- Arrows down -->
  <line x1="100" y1="186" x2="100" y2="226" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="255" y1="186" x2="255" y2="226" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="410" y1="186" x2="410" y2="226" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="572" y1="186" x2="572" y2="226" stroke="#444" stroke-width="1" marker-end="url(#arr)"/>

  <!-- TRIAGE LAYER -->
  <rect x="30" y="228" width="620" height="80" rx="10" fill="#1a1500" stroke="#f0a500" stroke-width="1.5"/>
