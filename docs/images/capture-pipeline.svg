  <!-- INPUT: Browser -->
  <rect x="185" y="74" width="140" height="110" rx="10" fill="#0d2d2d" stroke="#00b4b4" stroke-width="1"/>
  <text x="255" y="98" text-anchor="middle" fill="#00b4b4" font-size="13" font-weight="bold">Browser</text>
